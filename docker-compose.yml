version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: water-meter-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - water-meter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  thingsboard:
    image: thingsboard/tb-postgres:latest
    container_name: water-meter-thingsboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TB_DATABASE_TS_TYPE: sql
      SPRING_DATASOURCE_URL: jdbc:postgresql://${TB_POSTGRES_HOST}:${TB_POSTGRES_PORT}/${TB_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${TB_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${TB_POSTGRES_PASSWORD}
      TB_QUEUE_TYPE: in-memory
      TB_QUEUE_IN_MEMORY_STATS_PRINT_INTERVAL_MS: 60000
    volumes:
      - thingsboard_data:/data
      - thingsboard_logs:/var/log/thingsboard
      - ./config/thingsboard/thingsboard.yml:/config/thingsboard.yml
    ports:
      - "8080:8080"
      - "1883:1883"
      - "5683:5683/udp"
    networks:
      - water-meter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/auth/login"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: water-meter-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_COOKIE_DEFAULT_SECURE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - water-meter-network
    depends_on:
      - postgres
    restart: unless-stopped

  # LoRaWAN ChirpStack Components
  chirpstack-postgres:
    image: postgres:15-alpine
    container_name: chirpstack-postgres
    environment:
      POSTGRES_DB: chirpstack
      POSTGRES_USER: chirpstack
      POSTGRES_PASSWORD: chirpstack_password
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    volumes:
      - chirpstack_postgres_data:/var/lib/postgresql/data
    networks:
      - water-meter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpstack"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chirpstack-redis:
    image: redis:7-alpine
    container_name: chirpstack-redis
    volumes:
      - chirpstack_redis_data:/data
    networks:
      - water-meter-network
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2-alpine
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - water-meter-network
    restart: unless-stopped

  chirpstack:
    image: chirpstack/chirpstack:4-latest
    container_name: chirpstack
    command: -c /etc/chirpstack/chirpstack.toml
    ports:
      - "8081:8080"
      - "1700:1700/udp"
    environment:
      RUST_LOG: info
      RUST_BACKTRACE: 1
    volumes:
      - ./config/chirpstack/chirpstack.toml:/etc/chirpstack/chirpstack.toml
      - chirpstack_data:/data
    depends_on:
      - chirpstack-postgres
      - chirpstack-redis
      - mosquitto
    networks:
      - water-meter-network
    restart: unless-stopped

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4-latest
    container_name: chirpstack-gateway-bridge
    ports:
      - "1700:1700/udp"
    environment:
      RUST_LOG: info
    volumes:
      - ./config/chirpstack/gateway-bridge.toml:/etc/chirpstack-gateway-bridge/config.toml
    depends_on:
      - mosquitto
    networks:
      - water-meter-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  thingsboard_data:
    driver: local
  thingsboard_logs:
    driver: local
  pgadmin_data:
    driver: local
  chirpstack_postgres_data:
    driver: local
  chirpstack_redis_data:
    driver: local
  chirpstack_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local

networks:
  water-meter-network:
    driver: bridge
